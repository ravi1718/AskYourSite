<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines subtle background -->
  <g stroke="#1C1C2E" stroke-width="1" opacity="0.6">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <!-- Glow blobs -->
  <ellipse cx="960" cy="280" rx="300" ry="220" fill="#6366F1" opacity="0.07"/>
  <ellipse cx="120" cy="500" rx="180" ry="130" fill="#22D3EE" opacity="0.05"/>
  <!-- Large A logo left side -->
  <path d="M80 70 L210 530 H168 L150 455 H90 L72 530 H30 Z" fill="url(#brand)" filter="url(#glow)" opacity="0.95"/>
  <path d="M80 115 L178 518 H155 L140 455 H100 L86 518 H63 Z" fill="#050510"/>
  <path d="M97 390 H143 L132 455 H108 Z" fill="url(#brand)"/>
  <!-- White bevel on logo -->
  <path d="M80 70 L78 80 L38 530 L30 530 Z" fill="rgba(255,255,255,0.18)"/>
  <!-- Product name -->
  <text x="260" y="265" font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="80" font-weight="800" fill="white" letter-spacing="-2">AskYourSite</text>
  <!-- Cyan underline accent -->
  <rect x="260" y="282" width="580" height="3" fill="url(#brand)" rx="2"/>
  <!-- Tagline -->
  <text x="260" y="355" font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="30" font-weight="400" fill="#94A3B8">AI Sales &amp; Support Agent for Your Website</text>
  <!-- Feature pills -->
  <rect x="260" y="395" width="190" height="38" rx="19" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="355" y="419" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#22D3EE" text-anchor="middle">Train on your content</text>
  <rect x="464" y="395" width="175" height="38" rx="19" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="551" y="419" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#6366F1" text-anchor="middle">Deploy in 60 seconds</text>
  <rect x="653" y="395" width="130" height="38" rx="19" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="718" y="419" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#9333EA" text-anchor="middle">Always on 24/7</text>
  <!-- Pricing hint -->
  <text x="260" y="500" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#475569">Starting at $20/month · 7-day free trial · No credit card required</text>
  <!-- URL -->
  <text x="260" y="555" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#334155">askyoursite.in</text>
  <!-- Bottom gradient bar -->
  <rect x="0" y="614" width="1200" height="16" fill="url(#brand)" rx="0"/>
</svg>
